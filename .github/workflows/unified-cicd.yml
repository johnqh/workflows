---
# REQUIRED CALLER PERMISSIONS
# GitHub validates a reusable workflow's job permissions at compile time, before
# any job's `if:` is evaluated. This workflow contains jobs that request, across
# all of them, the union: contents:write (releases/tags), id-token:write (npm
# provenance in release_npm) and deployments:write (deploy_cloudflare/vercel).
# A caller that grants fewer scopes than this union fails at startup
# ("startup_failure", no logs) even if those jobs would skip. Every caller —
# including Python-only callers that publish nothing — must therefore declare:
#
#   permissions:
#     contents: write
#     id-token: write
#     deployments: write
#
# default_workflow_permissions may stay at "read"; the block above is what matters.
name: "Unified CI/CD - Reusable Workflow"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        default: "22.x"
      bun-version:
        description: "Bun version to use (only when bun.lock is detected)"
        type: string
        default: "latest"
      npm-access:
        description: "DEPRECATED / ignored. Package access now comes from each package.json's publishConfig.access (the publish step no longer passes --access). Kept only so existing callers that still set it don't error — safe to delete from ci-cd.yml."
        type: string
        default: "restricted"
      skip-npm-publish:
        description: "Skip NPM publishing even if NPM_TOKEN is configured (useful for apps that need NPM_TOKEN only for private dependencies)"
        type: boolean
        default: false
      publish-target:
        description: "Where to publish the npm package: 'npm' (npmjs.org via OIDC trusted publishing, the default) or 'github' (GitHub Packages via GITHUB_TOKEN). Set to 'github' per repo to migrate it to GitHub Packages without affecting other repos."
        type: string
        default: "npm"
      cloudflare-project-name:
        description: "Cloudflare Pages project name (defaults to repo name, only used if Cloudflare secrets are set)"
        type: string
        default: ""
      docker-image-name:
        description: "Docker image name (defaults to repo name, only used if Docker Hub secrets are set)"
        type: string
        default: ""
      docker-platforms:
        description: "Platforms to build. Narrow to linux/amd64 when a dependency ships no arm64 wheel, or the arm64 leg compiles it from source under emulation."
        type: string
        default: "linux/arm64,linux/amd64"
      python-version:
        description: "Python version to use (only for Python projects)"
        type: string
        default: "3.11"
      python-package-manager:
        description: "Python package manager: uv or pip (only for Python projects)"
        type: string
        default: "uv"
      pypi-publish:
        description: "Publish Python packages to PyPI when a pyproject.toml project changes version"
        type: boolean
        default: false
      pypi-repository-url:
        description: "Optional PyPI repository URL (for example, https://test.pypi.org/legacy/)"
        type: string
        default: ""
      github-release:
        description: "Create a git tag and GitHub Release for Python projects, independent of PyPI publishing"
        type: boolean
        default: false
      python-extras:
        description: "Comma-separated extras to install for Python projects (pip only), e.g. 'dev,ws'. Empty installs no extras."
        type: string
        default: "dev"
      python-strict:
        description: "Fail the build when ruff or pytest are missing after install, and let mypy failures fail the build"
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        description: "NPM authentication token for publishing and installing private packages"
        required: false
      DOCKERHUB_USERNAME:
        description: "Docker Hub username"
        required: false
      DOCKERHUB_TOKEN:
        description: "Docker Hub access token"
        required: false
      CLOUDFLARE_API_TOKEN:
        description: "Cloudflare API token for Pages deployment"
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: "Cloudflare account ID"
        required: false
      RAILWAY_TOKEN:
        description: "Railway API token for deployment"
        required: false
      RAILWAY_SERVICE:
        description: "Railway service name/ID to deploy"
        required: false
      VERCEL_TOKEN:
        description: "Vercel API token for deployment"
        required: false
      VERCEL_ORG_ID:
        description: "Vercel organization ID"
        required: false
      VERCEL_PROJECT_ID:
        description: "Vercel project ID"
        required: false
      PYPI_TOKEN:
        description: "PyPI API token for publishing Python packages"
        required: false
      GIT_DEP_TOKEN:
        description: "GitHub PAT with read-only Contents access to private repos used as git dependencies"
        required: false
      GH_PACKAGES_READ_TOKEN:
        description: "GitHub PAT with read:packages, to install @scope deps from GitHub Packages across repos (publish-target: github). Falls back to GITHUB_TOKEN when unset."
        required: false

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Detect project type"
        id: detect-pm
        run: |
          # Check for Docker-only project (Dockerfile but no code to build/test)
          if [ -f "Dockerfile" ] && [ ! -f "pyproject.toml" ] && [ ! -f "requirements.txt" ] && [ ! -f "setup.py" ] && [ ! -f "bun.lock" ] && [ ! -f "bun.lockb" ] && [ ! -f "package-lock.json" ] && [ ! -f "package.json" ]; then
            echo "manager=docker" >> $GITHUB_OUTPUT
            echo "🐳 Detected Docker-only project"
          # Check for Python project
          elif [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
            echo "manager=python" >> $GITHUB_OUTPUT
            echo "🐍 Detected Python project"
          elif [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            echo "manager=bun" >> $GITHUB_OUTPUT
            echo "🥟 Detected Bun project (bun.lock found)"
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "📦 Detected npm project"
          fi

      # ---- Python project steps ----
      - name: "Setup Python"
        if: steps.detect-pm.outputs.manager == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: "Configure git for private Python dependencies"
        if: steps.detect-pm.outputs.manager == 'python'
        env:
          GIT_DEP_TOKEN: ${{ secrets.GIT_DEP_TOKEN }}
        run: |
          if [ -n "$GIT_DEP_TOKEN" ]; then
            # --add is required: both insteadOf values map onto the same url.<base>
            # key, and a plain `git config` would clobber the first.
            git config --global --add url."https://x-access-token:${GIT_DEP_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
            git config --global --add url."https://x-access-token:${GIT_DEP_TOKEN}@github.com/".insteadOf "git@github.com:"
            echo "✅ git URL rewrite configured for private dependencies"
          else
            echo "ℹ️  GIT_DEP_TOKEN not set, skipping git rewrite"
          fi

      - name: "Install Python dependencies"
        if: steps.detect-pm.outputs.manager == 'python'
        env:
          PM: ${{ inputs.python-package-manager }}
          EXTRAS: ${{ inputs.python-extras }}
        run: |
          if [ "$PM" == "uv" ]; then
            echo "📦 Installing with uv"
            pip install uv
            uv sync
          else
            echo "📦 Installing with pip"
            if [ -f "pyproject.toml" ]; then
              if [ -n "$EXTRAS" ]; then
                echo "📦 Installing extras: $EXTRAS"
                pip install -e ".[$EXTRAS]"
              else
                pip install -e .
              fi
            elif [ -f "requirements.txt" ]; then
              pip install -r requirements.txt
            fi
          fi

      - name: "Verify Python tooling (strict)"
        if: steps.detect-pm.outputs.manager == 'python' && inputs.python-strict
        run: |
          # pip exits 0 with only a WARNING when an extra does not exist, so a
          # missing dev extra otherwise yields a green run that ran zero tests.
          missing=0
          for tool in pytest ruff; do
            if command -v "$tool" &>/dev/null; then
              echo "✅ $tool present"
            else
              echo "❌ $tool not installed but python-strict is enabled"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add these to [project.optional-dependencies] and pass them via python-extras."
            exit 1
          fi

      - name: "Python lint"
        if: steps.detect-pm.outputs.manager == 'python'
        run: |
          if command -v ruff &> /dev/null; then
            echo "🔍 Running ruff"
            ruff check .
          elif [ -f "pyproject.toml" ] && grep -q "ruff" pyproject.toml 2>/dev/null; then
            echo "🔍 Running ruff (from dev deps)"
            ruff check .
          else
            echo "ℹ️  No Python linter configured, skipping"
          fi

      - name: "Python type check"
        if: steps.detect-pm.outputs.manager == 'python'
        env:
          STRICT: ${{ inputs.python-strict }}
        run: |
          if command -v mypy &> /dev/null; then
            echo "📝 Running mypy"
            if [ "$STRICT" == "true" ]; then
              mypy src/ --ignore-missing-imports
            else
              mypy src/ --ignore-missing-imports || true
            fi
          else
            echo "ℹ️  mypy not installed, skipping type check"
          fi

      - name: "Python tests"
        if: steps.detect-pm.outputs.manager == 'python'
        run: |
          if command -v pytest &> /dev/null; then
            echo "🧪 Running pytest"
            pytest -m "not integration" -v
          else
            echo "ℹ️  pytest not installed, skipping tests"
          fi

      # ---- Node.js project steps ----
      # Setup Bun downloads the Bun zip from GitHub Releases, which sometimes
      # answers 504 for a minute or two. setup-bun retries internally, but only
      # within a few seconds, so a longer outage failed the whole job. Try up to
      # three times, spaced out, and fail only if the last attempt fails.
      - name: "Setup Bun"
        id: setup-bun-1
        if: steps.detect-pm.outputs.manager == 'bun'
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: "Wait before retrying Setup Bun"
        if: steps.detect-pm.outputs.manager == 'bun' && steps.setup-bun-1.outcome == 'failure'
        run: sleep 30

      - name: "Setup Bun (retry 1)"
        id: setup-bun-2
        if: steps.detect-pm.outputs.manager == 'bun' && steps.setup-bun-1.outcome == 'failure'
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: "Wait before retrying Setup Bun again"
        if: steps.detect-pm.outputs.manager == 'bun' && steps.setup-bun-2.outcome == 'failure'
        run: sleep 60

      - name: "Setup Bun (retry 2)"
        if: steps.detect-pm.outputs.manager == 'bun' && steps.setup-bun-2.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: "Setup Node.js"
        if: steps.detect-pm.outputs.manager == 'npm'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"

      # --- Consume-side registry routing -------------------------------------
      # For publish-target: github, the repo's own @<owner> dependencies resolve
      # from GitHub Packages (authenticated with the built-in GITHUB_TOKEN, which
      # needs no NPM_TOKEN) while every other dependency stays on npmjs. This
      # .npmrc replaces any committed one for the duration of the job. For the
      # default npm path, behavior is unchanged (npmjs + NPM_TOKEN). No job-level
      # permissions are declared here on purpose (see release_github_packages);
      # the token's packages scope comes from the caller's top-level permissions.
      - name: "Configure registry for GitHub Packages (consume @scope deps)"
        if: inputs.publish-target == 'github'
        run: |
          OWNER_LC="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "registry=https://registry.npmjs.org/"
            echo "@$OWNER_LC:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}"
          } > .npmrc
          cp .npmrc "$HOME/.npmrc"
          echo "Routed @$OWNER_LC scope -> GitHub Packages for install"

      - name: "Setup npm auth for Bun"
        if: steps.detect-pm.outputs.manager == 'bun' && inputs.publish-target != 'github'
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: "Install dependencies (Bun, npmjs)"
        if: steps.detect-pm.outputs.manager == 'bun' && inputs.publish-target != 'github'
        run: bun install
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Install dependencies (Bun, GitHub Packages)"
        if: steps.detect-pm.outputs.manager == 'bun' && inputs.publish-target == 'github'
        run: bun install
        env:
          # Consuming ANOTHER repo's package needs a read:packages PAT (org secret
          # GH_PACKAGES_READ_TOKEN): the built-in GITHUB_TOKEN only reads its own
          # repo's packages. Falls back to GITHUB_TOKEN when the secret is unset
          # (fine for public packages / a repo's own package).
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "Install dependencies (npm, npmjs)"
        if: steps.detect-pm.outputs.manager == 'npm' && inputs.publish-target != 'github'
        run: |
          # Workaround for Rollup optional dependencies issue
          # https://github.com/npm/cli/issues/4828
          if grep -q '"rollup"' package.json 2>/dev/null; then
            echo "📦 Detected Rollup, using workaround for optional dependencies"
            rm -rf node_modules package-lock.json
            npm install --legacy-peer-deps
          else
            npm ci
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Install dependencies (npm, GitHub Packages)"
        if: steps.detect-pm.outputs.manager == 'npm' && inputs.publish-target == 'github'
        run: |
          # npm install (not ci): the lockfile's resolved registry URLs change when
          # a scope is rerouted to GitHub Packages, so a frozen ci would mismatch.
          if grep -q '"rollup"' package.json 2>/dev/null; then
            rm -rf node_modules package-lock.json
            npm install --legacy-peer-deps
          else
            npm install
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "Run type checking"
        if: steps.detect-pm.outputs.manager != 'python' && steps.detect-pm.outputs.manager != 'docker'
        run: |
          if [ ! -f "tsconfig.json" ]; then
            echo "ℹ️  No tsconfig.json found, skipping type check"
            exit 0
          fi

          PM="${{ steps.detect-pm.outputs.manager }}"

          # Check which typecheck script exists
          if grep -q '"typecheck"' package.json 2>/dev/null; then
            echo "📝 Running typecheck script"
            if [ "$PM" == "bun" ]; then
              bun run typecheck
            else
              npm run typecheck
            fi
          elif grep -q '"type-check"' package.json 2>/dev/null; then
            echo "📝 Running type-check script"
            if [ "$PM" == "bun" ]; then
              bun run type-check
            else
              npm run type-check
            fi
          else
            echo "📝 No typecheck script found, running tsc directly"
            if [ "$PM" == "bun" ]; then
              bunx tsc --noEmit
            else
              npx tsc --noEmit
            fi
          fi

      - name: "Run linting"
        if: steps.detect-pm.outputs.manager != 'python' && steps.detect-pm.outputs.manager != 'docker'
        run: |
          PM="${{ steps.detect-pm.outputs.manager }}"

          if ! grep -q '"lint"' package.json 2>/dev/null; then
            echo "ℹ️  No lint script found, skipping"
            exit 0
          fi

          echo "🔍 Running lint"
          if [ "$PM" == "bun" ]; then
            bun run lint
          else
            npm run lint
          fi

      - name: "Run tests"
        if: steps.detect-pm.outputs.manager != 'python' && steps.detect-pm.outputs.manager != 'docker'
        run: |
          PM="${{ steps.detect-pm.outputs.manager }}"

          # Use test:unit if available (excludes integration tests)
          if grep -q '"test:unit"' package.json 2>/dev/null; then
            echo "🧪 Running test:unit script (unit tests only)"
            if [ "$PM" == "bun" ]; then
              bun run test:unit
            else
              npm run test:unit
            fi
          elif grep -q '"test"' package.json 2>/dev/null; then
            echo "🧪 Running test script"
            if [ "$PM" == "bun" ]; then
              bun run test
            else
              npm test
            fi
          else
            echo "ℹ️  No test script found, skipping"
          fi

      - name: "Build project"
        if: steps.detect-pm.outputs.manager != 'python' && steps.detect-pm.outputs.manager != 'docker'
        run: |
          PM="${{ steps.detect-pm.outputs.manager }}"
          # Pass VITE_* secrets as environment variables to the build
          export $(echo '${{ toJSON(secrets) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' | grep -E '^(VITE_|REACT_APP_|NEXT_PUBLIC_|BUILD_)' || true)
          # Use build:ci if available (e.g., for mail_box_contracts without cargo)
          if grep -q '"build:ci"' package.json 2>/dev/null; then
            echo "📦 Using build:ci script"
            if [ "$PM" == "bun" ]; then
              bun run build:ci
            else
              npm run build:ci
            fi
          elif grep -q '"build"' package.json 2>/dev/null; then
            echo "📦 Using build script"
            if [ "$PM" == "bun" ]; then
              bun run build
            else
              npm run build
            fi
          else
            echo "ℹ️  No build script found, skipping build step"
          fi

  check_for_release:
    name: "Check Release Status"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      version_tag: ${{ steps.check.outputs.version_tag }}
      has_package_json: ${{ steps.check.outputs.has_package_json }}
      has_pyproject_toml: ${{ steps.check.outputs.has_pyproject_toml }}
      package_name: ${{ steps.check.outputs.package_name }}
      package_name_unscoped: ${{ steps.check.outputs.package_name_unscoped }}
      is_develop_branch: ${{ steps.check.outputs.is_develop_branch }}
      cloudflare_configured: ${{ steps.check.outputs.cloudflare_configured }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: "Check if should trigger release"
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cloudflare_configured=true" >> "$GITHUB_OUTPUT"
            echo "☁️ Cloudflare secrets are configured"
          else
            echo "cloudflare_configured=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Cloudflare secrets not configured; skipping Cloudflare deployment"
          fi

          # Check if we're on develop branch
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "is_develop_branch=true" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Develop branch detected - running tests only, skipping all deployments"
            exit 0
          else
            echo "is_develop_branch=false" >> $GITHUB_OUTPUT
          fi

          # Check project type for version detection
          if [ -f "package.json" ]; then
            echo "has_package_json=true" >> $GITHUB_OUTPUT
            echo "has_pyproject_toml=false" >> $GITHUB_OUTPUT
          elif [ -f "pyproject.toml" ]; then
            echo "has_package_json=false" >> $GITHUB_OUTPUT
            echo "has_pyproject_toml=true" >> $GITHUB_OUTPUT
          elif [ -f "Dockerfile" ]; then
            echo "has_package_json=false" >> $GITHUB_OUTPUT
            echo "has_pyproject_toml=false" >> $GITHUB_OUTPUT
            echo "🐳 Docker-only project detected"
          else
            echo "has_package_json=false" >> $GITHUB_OUTPUT
            echo "has_pyproject_toml=false" >> $GITHUB_OUTPUT
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No package.json, pyproject.toml, or Dockerfile found, skipping release"
            exit 0
          fi

          # Get commit message
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "Commit message: $COMMIT_MSG"

          # Skip release only for PR events that weren't merged
          if [[ "${{ github.event_name }}" == "pull_request" ]] && [[ "${{ github.event.action }}" != "closed" || "${{ github.event.pull_request.merged }}" != "true" ]]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️  PR not merged, skipping release"
            exit 0
          fi

          # Skip only if explicitly marked to skip CI
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]] || [[ "$COMMIT_MSG" == *"[skip-ci]"* ]]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Commit marked to skip CI: $COMMIT_MSG"
            exit 0
          fi

          # Get current version and package name
          if [ -f "package.json" ]; then
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            PACKAGE_NAME=$(node -p "require('./package.json').name")
          elif [ -f "pyproject.toml" ]; then
            CURRENT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
            PACKAGE_NAME=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          elif [ -f "Dockerfile" ]; then
            # Docker-only project: extract version from LABEL or ARG, fall back to git tag
            CURRENT_VERSION=$(grep -oP '(?<=LABEL version=")[^"]+' Dockerfile 2>/dev/null || \
                              grep -oP '(?<=ARG VERSION=)\S+' Dockerfile 2>/dev/null || \
                              git describe --tags --abbrev=0 2>/dev/null || \
                              echo "0.0.0")
            REPO_NAME="${{ github.event.repository.name }}"
            PACKAGE_NAME="${REPO_NAME}"
          fi

          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=v$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          # Unscoped name (strip "@scope/") — GitHub Packages APIs address packages
          # by their unscoped name, e.g. "types" for "@sudobility/types".
          echo "package_name_unscoped=${PACKAGE_NAME##*/}" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT

          echo "✅ Release checks passed for version $CURRENT_VERSION"
          echo "ℹ️  Each deploy job will check its own registry for version existence"

  release_npm:
    name: "Release to NPM"
    needs:
      - test
      - check_for_release
    if: |
      needs.check_for_release.outputs.should_release == 'true' &&
      needs.check_for_release.outputs.has_package_json == 'true' &&
      inputs.skip-npm-publish != true &&
      inputs.publish-target != 'github'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: "Check if NPM secrets are configured"
        id: check-secrets
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ NPM_TOKEN is configured"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "ℹ️  NPM_TOKEN not configured, skipping NPM publishing"
          fi

      - name: "Checkout"
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: "Detect package manager"
        if: steps.check-secrets.outputs.configured == 'true'
        id: detect-pm
        run: |
          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            echo "manager=bun" >> $GITHUB_OUTPUT
            echo "🥟 Detected Bun project (bun.lock found)"
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "📦 Detected npm project"
          fi

      # Retried like the test job's Setup Bun: GitHub Releases sometimes answers
      # 504 for longer than setup-bun's own quick retries last.
      - name: "Setup Bun"
        id: setup-bun-1
        if: steps.check-secrets.outputs.configured == 'true' && steps.detect-pm.outputs.manager == 'bun'
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: "Wait before retrying Setup Bun"
        if: steps.check-secrets.outputs.configured == 'true' && steps.detect-pm.outputs.manager == 'bun' && steps.setup-bun-1.outcome == 'failure'
        run: sleep 30

      - name: "Setup Bun (retry 1)"
        id: setup-bun-2
        if: steps.check-secrets.outputs.configured == 'true' && steps.detect-pm.outputs.manager == 'bun' && steps.setup-bun-1.outcome == 'failure'
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: "Wait before retrying Setup Bun again"
        if: steps.check-secrets.outputs.configured == 'true' && steps.detect-pm.outputs.manager == 'bun' && steps.setup-bun-2.outcome == 'failure'
        run: sleep 60

      - name: "Setup Bun (retry 2)"
        if: steps.check-secrets.outputs.configured == 'true' && steps.detect-pm.outputs.manager == 'bun' && steps.setup-bun-2.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: "Setup Node.js"
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"

      - name: "Check if version already published to NPM"
        if: steps.check-secrets.outputs.configured == 'true'
        id: check-npm-version
        run: |
          CURRENT_VERSION="${{ needs.check_for_release.outputs.version }}"
          PACKAGE_NAME="${{ needs.check_for_release.outputs.package_name }}"

          echo "Package: $PACKAGE_NAME"
          echo "Current version: $CURRENT_VERSION"

          # Ask for this exact version rather than the latest dist-tag: a
          # republish of an older version is just as forbidden as a republish
          # of the newest one.
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$CURRENT_VERSION" version 2>/dev/null || echo "")
          echo "Published version on NPM: ${PUBLISHED_VERSION:-none}"

          if [ "$CURRENT_VERSION" == "$PUBLISHED_VERSION" ]; then
            echo "version_exists=true" >> $GITHUB_OUTPUT
            echo "ℹ️  Version $CURRENT_VERSION already exists on NPM, skipping publish"
          else
            echo "version_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version $CURRENT_VERSION not on NPM, will publish"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Setup npm auth for Bun"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-npm-version.outputs.version_exists != 'true' && steps.detect-pm.outputs.manager == 'bun'
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: "Install dependencies (Bun)"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-npm-version.outputs.version_exists != 'true' && steps.detect-pm.outputs.manager == 'bun'
        run: bun install
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Install dependencies (npm)"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-npm-version.outputs.version_exists != 'true' && steps.detect-pm.outputs.manager == 'npm'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Build project"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-npm-version.outputs.version_exists != 'true'
        run: |
          PM="${{ steps.detect-pm.outputs.manager }}"
          # Use build:ci if available (e.g., for mail_box_contracts without cargo)
          if grep -q '"build:ci"' package.json 2>/dev/null; then
            echo "📦 Using build:ci script"
            if [ "$PM" == "bun" ]; then
              bun run build:ci
            else
              npm run build:ci
            fi
          elif grep -q '"build"' package.json 2>/dev/null; then
            echo "📦 Using build script"
            if [ "$PM" == "bun" ]; then
              bun run build
            else
              npm run build
            fi
          else
            echo "ℹ️  No build script found, skipping build step"
          fi

      - name: "Create GitHub Release"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-npm-version.outputs.version_exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check_for_release.outputs.version_tag }}
          name: "Release ${{ needs.check_for_release.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing uses OIDC Trusted Publishing, not a long-lived token. npm's
      # token here is read-only (installs private deps) and CANNOT publish, so
      # the token-based .npmrc written by the install steps must be cleared
      # before `npm publish`, or npm would try the read-only token and 403.
      # Trusted publisher is matched by npm against the CALLER workflow
      # (ci-cd.yml in each package repo) — configure it per package on npmjs.com.
      - name: "Prepare npm for OIDC trusted publishing"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-npm-version.outputs.version_exists != 'true'
        run: |
          # Trusted publishing requires npm >= 11.5.1; Node 22 ships npm 10.x.
          npm install -g npm@latest
          echo "npm $(npm --version)"
          # Force the OIDC path. npm must NOT find the read-only NPM_TOKEN at
          # publish time: a 2FA-bypass token's direct publish is now *staged*
          # (deferred for 2FA), not completed, which strands the version
          # (E409 "previously staged" on any retry; never promoted to the
          # registry). The token reaches npm two ways we have to kill here:
          #   1. The .npmrc files the install steps wrote.
          #   2. setup-node's own .npmrc at $NPM_CONFIG_USERCONFIG, which holds
          #      //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
          # We remove (1) and, in the publish step, point npm at a clean,
          # token-free userconfig and drop NODE_AUTH_TOKEN from the env, so the
          # only credential left is the GitHub OIDC id-token.
          rm -f .npmrc "$HOME/.npmrc"
          CLEAN_NPMRC="$RUNNER_TEMP/.npmrc-oidc"
          printf 'registry=https://registry.npmjs.org/\n' > "$CLEAN_NPMRC"
          echo "CLEAN_NPMRC=$CLEAN_NPMRC" >> "$GITHUB_ENV"

      - name: "Publish to NPM"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-npm-version.outputs.version_exists != 'true'
        run: |
          # Access (public/restricted) comes from each package's
          # package.json "publishConfig.access" — the single source of truth.
          # We intentionally do NOT pass --access, so npm honors publishConfig.
          # (npm locks a scoped package's visibility at its first publish; this
          # only governs brand-new packages.) Auth is via OIDC trusted publishing.
          echo "📦 Publishing (access from package.json publishConfig; OIDC trusted publishing)"

          # The pre-check can miss a version published moments earlier: the
          # registry read path is CDN-cached, so a just-published version stays
          # invisible to `npm view` for up to a minute. Losing that race means
          # the version is already on NPM — which is the outcome we wanted.
          #
          # Auth: strip every token source so npm uses OIDC trusted publishing
          # and not the read-only token (see the prepare step for why). A clean
          # userconfig + dropping NODE_AUTH_TOKEN/NPM_TOKEN leaves only the
          # OIDC id-token GitHub provides via `permissions: id-token: write`.
          set +e
          PUBLISH_OUTPUT=$(env -u NODE_AUTH_TOKEN -u NPM_TOKEN -u BUN_AUTH_TOKEN \
            NPM_CONFIG_USERCONFIG="${CLEAN_NPMRC:-$RUNNER_TEMP/.npmrc-oidc}" \
            npm publish 2>&1)
          PUBLISH_STATUS=$?
          set -e
          echo "$PUBLISH_OUTPUT"

          if [ $PUBLISH_STATUS -eq 0 ]; then
            exit 0
          fi

          # Already on the registry (race with the pre-check or a prior run).
          if echo "$PUBLISH_OUTPUT" | grep -qi "cannot publish over the previously published version"; then
            echo "ℹ️  Version already on NPM — published outside this run, nothing to do"
            exit 0
          fi

          # Staged-but-not-completed: npm could not AUTHORIZE this publish, so it
          # staged the version pending 2FA instead of completing it. The version
          # never promotes on its own (stays invisible; any retry of the same
          # version hits this same E409). Almost always this means no Trusted
          # Publisher is configured for the package that matches this workflow.
          if echo "$PUBLISH_OUTPUT" | grep -qi "previously staged version"; then
            echo "::error::npm STAGED this publish instead of completing it — the publish was not authorized, so npm deferred it for 2FA."
            echo "Most likely cause: no npm Trusted Publisher is configured for ${{ needs.check_for_release.outputs.package_name }} matching this repo + the CALLER workflow 'ci-cd.yml'."
            echo "Fix: run workflows/scripts/setup-trusted-publishers.sh (needs interactive 2FA), or add it on npmjs.com:"
            echo "  package Settings → Trusted Publisher → GitHub Actions: repository = this package's repo, workflow file = ci-cd.yml (NOT unified-cicd.yml)."
            echo "Then bump the version and re-run — the stranded staged version cannot be reused."
          fi
          exit $PUBLISH_STATUS

      - name: "Notify deployment success"
        if: success() && steps.check-secrets.outputs.configured == 'true' && steps.check-npm-version.outputs.version_exists != 'true'
        run: |
          echo "🚀 Release ${{ needs.check_for_release.outputs.version }} deployed successfully!"
          echo "• NPM: https://www.npmjs.com/package/${{ needs.check_for_release.outputs.package_name }}/v/${{ needs.check_for_release.outputs.version }}"
          echo "• GitHub: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check_for_release.outputs.version_tag }}"

      - name: "Notify deployment failure"
        if: failure() && steps.check-secrets.outputs.configured == 'true'
        run: |
          echo "❌ Release deployment FAILED for commit ${{ github.sha }}"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # GitHub Packages publishing path — opt in per repo with `publish-target: github`
  # in ci-cd.yml. Auth is the built-in GITHUB_TOKEN (no npm token, no OIDC trusted
  # publisher), and old versions are pruned to cap storage. REQUIREMENT: the repo
  # must be owned by the org whose name matches the package scope (e.g. package
  # "@sudobility/x" -> repo owned by org "sudobility"); GitHub Packages rejects a
  # scope that doesn't match the owner.
  release_github_packages:
    name: "Release to GitHub Packages"
    needs:
      - test
      - check_for_release
    if: |
      needs.check_for_release.outputs.should_release == 'true' &&
      needs.check_for_release.outputs.has_package_json == 'true' &&
      inputs.skip-npm-publish != true &&
      inputs.publish-target == 'github'
    runs-on: ubuntu-latest
    # NO job-level permissions block on purpose. GitHub validates a reusable
    # workflow's nested-job permission REQUESTS at load time, BEFORE `if:` is
    # evaluated — so a job here that requests `packages: write` fails the entire
    # workflow for EVERY caller that doesn't grant it, including npm-path callers
    # where this job is skipped. Instead this job inherits the caller's granted
    # permissions. A repo opting into publish-target: github MUST grant, in its
    # own ci-cd.yml top-level permissions:
    #     contents: write   # create the GitHub Release
    #     packages: write   # publish to GitHub Packages + prune old versions
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Detect package manager"
        id: detect-pm
        run: |
          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            echo "manager=bun" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi

      - name: "Setup Bun"
        if: steps.detect-pm.outputs.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      # Route the package's scope to GitHub Packages and wire the token. The owner
      # is lowercased because npm scopes are always lowercase even when the GitHub
      # org is displayed with capitals (e.g. org "Sudobility" -> scope
      # "@sudobility"). The ${NODE_AUTH_TOKEN} placeholder is interpolated by npm
      # at publish time, so no secret is written into the file.
      - name: "Configure npm for GitHub Packages"
        run: |
          OWNER_LC="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "Scope routed to GitHub Packages: @$OWNER_LC"
          {
            echo "@$OWNER_LC:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}"
          } > .npmrc
          cp .npmrc "$HOME/.npmrc"

      - name: "Check if version already on GitHub Packages"
        id: check-gh-version
        run: |
          CURRENT_VERSION="${{ needs.check_for_release.outputs.version }}"
          PACKAGE_NAME="${{ needs.check_for_release.outputs.package_name }}"
          PUBLISHED=$(npm view "$PACKAGE_NAME@$CURRENT_VERSION" version 2>/dev/null || echo "")
          if [ "$CURRENT_VERSION" = "$PUBLISHED" ]; then
            echo "version_exists=true" >> $GITHUB_OUTPUT
            echo "ℹ️  $PACKAGE_NAME@$CURRENT_VERSION already on GitHub Packages, skipping publish"
          else
            echo "version_exists=false" >> $GITHUB_OUTPUT
            echo "✅ $PACKAGE_NAME@$CURRENT_VERSION not on GitHub Packages, will publish"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Install dependencies"
        if: steps.check-gh-version.outputs.version_exists != 'true'
        run: |
          # npm install (not ci): scope reroute to GitHub Packages changes the
          # lockfile's resolved URLs, so a frozen ci would mismatch.
          if [ "${{ steps.detect-pm.outputs.manager }}" = "bun" ]; then
            bun install
          else
            npm install
          fi
        env:
          # read:packages PAT to pull cross-repo @scope deps; falls back to the
          # built-in token for public / own-repo packages.
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "Build project"
        if: steps.check-gh-version.outputs.version_exists != 'true'
        run: |
          PM="${{ steps.detect-pm.outputs.manager }}"
          if grep -q '"build:ci"' package.json 2>/dev/null; then
            if [ "$PM" = "bun" ]; then bun run build:ci; else npm run build:ci; fi
          elif grep -q '"build"' package.json 2>/dev/null; then
            if [ "$PM" = "bun" ]; then bun run build; else npm run build; fi
          else
            echo "ℹ️  No build script found, skipping build"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          BUN_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "Create GitHub Release"
        if: steps.check-gh-version.outputs.version_exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check_for_release.outputs.version_tag }}
          name: "Release ${{ needs.check_for_release.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Publish to GitHub Packages"
        if: steps.check-gh-version.outputs.version_exists != 'true'
        run: |
          echo "📦 Publishing ${{ needs.check_for_release.outputs.package_name }} to GitHub Packages"
          # Access/visibility is governed by the package + repo on GitHub; routing
          # and auth come from the .npmrc written above. No --access (consistent
          # with the npm path: package.json publishConfig is the source of truth).
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep only the 3 newest versions to cap GitHub Packages storage. GITHUB_TOKEN
      # with packages: write can delete versions of a package owned by this repo.
      # If this fails with a permissions error on an org-scoped package, supply a
      # PAT with delete:packages as the token instead. continue-on-error so a prune
      # failure never fails an otherwise-successful release.
      - name: "Prune old versions (keep last 3)"
        if: steps.check-gh-version.outputs.version_exists != 'true'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ needs.check_for_release.outputs.package_name_unscoped }}
          package-type: npm
          min-versions-to-keep: 3
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Notify"
        if: success() && steps.check-gh-version.outputs.version_exists != 'true'
        run: |
          echo "🚀 Published ${{ needs.check_for_release.outputs.package_name }}@${{ needs.check_for_release.outputs.version }} to GitHub Packages"
          echo "• https://github.com/${{ github.repository }}/pkgs/npm/${{ needs.check_for_release.outputs.package_name_unscoped }}"

  release_pypi:
    name: "Release to PyPI"
    needs:
      - test
      - check_for_release
    if: |
      inputs.pypi-publish == true &&
      needs.check_for_release.outputs.should_release == 'true' &&
      needs.check_for_release.outputs.has_pyproject_toml == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Check if PyPI token is configured"
        id: check-secrets
        run: |
          if [ -n "${{ secrets.PYPI_TOKEN }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "mode=token" >> $GITHUB_OUTPUT
            echo "✅ PYPI_TOKEN is configured"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "mode=skip" >> $GITHUB_OUTPUT
            echo "ℹ️  PYPI_TOKEN not configured"
          fi

      - name: "Skip PyPI publishing"
        if: steps.check-secrets.outputs.configured != 'true'
        run: |
          echo "ℹ️  PyPI publishing is disabled for this run."
          echo "ℹ️  Configure PYPI_TOKEN to use the reusable workflow, or use a repository-local wrapper workflow for Trusted Publishing (OIDC)."

      - name: "Checkout"
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: "Setup Python"
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: "Check if version already published to PyPI"
        if: steps.check-secrets.outputs.configured == 'true'
        id: check-pypi-version
        run: |
          CURRENT_VERSION="${{ needs.check_for_release.outputs.version }}"
          PACKAGE_NAME="${{ needs.check_for_release.outputs.package_name }}"
          REPOSITORY_URL="${{ inputs.pypi-repository-url }}"

          echo "Package: $PACKAGE_NAME"
          echo "Current version: $CURRENT_VERSION"

          PUBLISHED_VERSION=$(python3 -c "
          import urllib.request, json
          try:
              base = '${REPOSITORY_URL}'.rstrip('/')
              if base.endswith('/legacy'):
                  base = base[:-7]
              if not base:
                  base = 'https://pypi.org'
              resp = urllib.request.urlopen(f'{base}/pypi/${PACKAGE_NAME}/json')
              data = json.loads(resp.read())
              print(data['info']['version'])
          except Exception:
              print('0.0.0')
          " 2>/dev/null || echo "0.0.0")
          echo "Published version on PyPI: $PUBLISHED_VERSION"

          if [ "$CURRENT_VERSION" == "$PUBLISHED_VERSION" ]; then
            echo "version_exists=true" >> $GITHUB_OUTPUT
            echo "ℹ️  Version $CURRENT_VERSION already exists on PyPI, skipping publish"
          else
            echo "version_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version $CURRENT_VERSION not on PyPI, will publish"
          fi

      - name: "Install build tools"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-pypi-version.outputs.version_exists != 'true'
        run: pip install build twine

      - name: "Build package"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-pypi-version.outputs.version_exists != 'true'
        run: python -m build

      - name: "Create GitHub Release"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-pypi-version.outputs.version_exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check_for_release.outputs.version_tag }}
          name: "Release ${{ needs.check_for_release.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Publish to PyPI"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-pypi-version.outputs.version_exists != 'true'
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
          TWINE_REPOSITORY_URL: ${{ inputs.pypi-repository-url }}

      - name: "Notify deployment success"
        if: success() && steps.check-secrets.outputs.configured == 'true' && steps.check-pypi-version.outputs.version_exists != 'true'
        run: |
          echo "🐍 Release ${{ needs.check_for_release.outputs.version }} deployed successfully!"
          echo "• PyPI: https://pypi.org/project/${{ needs.check_for_release.outputs.package_name }}/${{ needs.check_for_release.outputs.version }}/"
          echo "• GitHub: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check_for_release.outputs.version_tag }}"

      - name: "Notify deployment failure"
        if: failure() && steps.check-secrets.outputs.configured == 'true'
        run: |
          echo "❌ PyPI release deployment FAILED for commit ${{ github.sha }}"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  release_python:
    name: "Tag and GitHub Release (Python)"
    needs:
      - test
      - check_for_release
    # pypi-publish != true avoids a double release: release_pypi already
    # creates a GitHub Release when it publishes.
    if: |
      inputs.github-release == true &&
      inputs.pypi-publish != true &&
      needs.check_for_release.outputs.should_release == 'true' &&
      needs.check_for_release.outputs.has_pyproject_toml == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: "Check if tag already exists"
        id: check-tag
        env:
          TAG: ${{ needs.check_for_release.outputs.version_tag }}
        run: |
          # check_for_release sets should_release=true on every main push and
          # never compares against existing tags, so guard here.
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Tag $TAG already exists, skipping release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✅ Tag $TAG does not exist, will create"
          fi

      - name: "Create GitHub Release"
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check_for_release.outputs.version_tag }}
          name: "Release ${{ needs.check_for_release.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Notify"
        if: success() && steps.check-tag.outputs.exists == 'false'
        run: |
          echo "🏷️  Tagged ${{ needs.check_for_release.outputs.version_tag }}"
          echo "• GitHub: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check_for_release.outputs.version_tag }}"

  deploy_docker:
    name: "Deploy to Docker Hub"
    needs:
      - test
      - check_for_release
    if: needs.check_for_release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Check if Docker Hub secrets are configured"
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ Docker Hub secrets are configured"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Docker Hub secrets not configured, skipping Docker deployment"
          fi

      - name: "Determine image name"
        if: steps.check-secrets.outputs.configured == 'true'
        id: image-name
        run: |
          if [ -n "${{ inputs.docker-image-name }}" ]; then
            IMAGE_NAME="${{ inputs.docker-image-name }}"
          else
            IMAGE_NAME="${{ github.event.repository.name }}"
          fi
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "🐳 Docker image name: $IMAGE_NAME"

      - name: "Check if version already exists on Docker Hub"
        if: steps.check-secrets.outputs.configured == 'true'
        id: check-docker-version
        run: |
          VERSION="${{ needs.check_for_release.outputs.version }}"
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image-name.outputs.name }}"

          echo "Image: $IMAGE_NAME"
          echo "Version: $VERSION"

          # Check if tag exists on Docker Hub using the API
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${VERSION}")

          if [ "$HTTP_STATUS" == "200" ]; then
            echo "version_exists=true" >> $GITHUB_OUTPUT
            echo "ℹ️  Version $VERSION already exists on Docker Hub ($IMAGE_NAME:$VERSION), skipping push"
          else
            echo "version_exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version $VERSION not on Docker Hub, will build and push"
          fi

      - name: "Checkout"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-docker-version.outputs.version_exists != 'true'
        uses: actions/checkout@v6

      - name: "Set up QEMU"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-docker-version.outputs.version_exists != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: "arm64,amd64"

      - name: "Set up Docker Buildx"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-docker-version.outputs.version_exists != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ inputs.docker-platforms }}

      - name: "Login to Docker Hub"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-docker-version.outputs.version_exists != 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Extract metadata (tags, labels) for Docker"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-docker-version.outputs.version_exists != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image-name.outputs.name }}
          flavor: |
            latest=true
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.check_for_release.outputs.version }}

      - name: "Build and push Docker image"
        if: steps.check-secrets.outputs.configured == 'true' && steps.check-docker-version.outputs.version_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ inputs.docker-platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}

      - name: "Notify Docker deployment success"
        if: success() && steps.check-secrets.outputs.configured == 'true' && steps.check-docker-version.outputs.version_exists != 'true'
        run: |
          echo "🐳 Docker image pushed successfully!"
          echo "• Image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image-name.outputs.name }}:latest"
          echo "• Version tag: ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image-name.outputs.name }}:${{ needs.check_for_release.outputs.version }}"

  deploy_cloudflare:
    name: "Deploy to Cloudflare Pages"
    needs:
      - test
      - check_for_release
    if: |
      needs.check_for_release.outputs.should_release == 'true' &&
      needs.check_for_release.outputs.cloudflare_configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: "Install dependencies"
        run: |
          # Workaround for Rollup optional dependencies issue
          # https://github.com/npm/cli/issues/4828
          if grep -q '"rollup"' package.json 2>/dev/null; then
            echo "📦 Detected Rollup, using workaround for optional dependencies"
            rm -rf node_modules package-lock.json
            npm install --legacy-peer-deps
          else
            npm ci
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Run linting (non-blocking)"
        run: npm run lint || echo "⚠️  Linting failed but continuing with deployment"

      - name: "Build project"
        run: |
          # Pass all secrets as environment variables to the build
          # Infrastructure tokens (NPM_TOKEN, CLOUDFLARE_*, etc.) won't affect the build
          # Only build-time variables (VITE_*, REACT_APP_*, etc.) will be used
          export $(echo '${{ toJSON(secrets) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' | grep -E '^(VITE_|REACT_APP_|NEXT_PUBLIC_|BUILD_)' || true)
          npm run build

      - name: "Determine project name"
        id: project-name
        run: |
          if [ -n "${{ inputs.cloudflare-project-name }}" ]; then
            PROJECT_NAME="${{ inputs.cloudflare-project-name }}"
          else
            PROJECT_NAME="${{ github.event.repository.name }}"
          fi
          echo "name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "☁️  Cloudflare project name: $PROJECT_NAME"

      - name: "Deploy to Cloudflare Pages"
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ steps.project-name.outputs.name }}
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: "Notify Cloudflare deployment success"
        run: |
          echo "☁️  Deployed to Cloudflare Pages successfully!"
          echo "• Project: ${{ steps.project-name.outputs.name }}"

  deploy_railway:
    name: "Deploy to Railway"
    needs:
      - test
      - check_for_release
    if: needs.check_for_release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Check if Railway secrets are configured"
        id: check-secrets
        run: |
          if [ -n "${{ secrets.RAILWAY_TOKEN }}" ] && [ -n "${{ secrets.RAILWAY_SERVICE }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ Railway secrets are configured"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Railway secrets not configured, skipping deployment"
          fi

      - name: "Checkout"
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: "Setup Node.js"
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: "Install Railway CLI"
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: "Deploy to Railway"
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          railway link ${{ secrets.RAILWAY_SERVICE }}
          railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: "Notify Railway deployment success"
        if: success() && steps.check-secrets.outputs.configured == 'true'
        run: |
          echo "🚂 Deployed to Railway successfully!"
          echo "• Service: ${{ secrets.RAILWAY_SERVICE }}"

      - name: "Notify Railway deployment failure"
        if: failure() && steps.check-secrets.outputs.configured == 'true'
        run: |
          echo "❌ Railway deployment FAILED for commit ${{ github.sha }}"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy_vercel:
    name: "Deploy to Vercel"
    needs:
      - test
      - check_for_release
    if: needs.check_for_release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: "Check if Vercel secrets are configured"
        id: check-secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ Vercel secrets are configured"
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Vercel secrets not configured, skipping deployment"
          fi

      - name: "Checkout"
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: "Setup Node.js"
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"

      - name: "Install dependencies"
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          # Workaround for Rollup optional dependencies issue
          # https://github.com/npm/cli/issues/4828
          if grep -q '"rollup"' package.json 2>/dev/null; then
            echo "📦 Detected Rollup, using workaround for optional dependencies"
            rm -rf node_modules package-lock.json
            npm install --legacy-peer-deps
          else
            npm ci
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "Run linting (non-blocking)"
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm run lint || echo "⚠️  Linting failed but continuing with deployment"

      - name: "Build project"
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          # Pass all secrets as environment variables to the build
          # Infrastructure tokens (NPM_TOKEN, CLOUDFLARE_*, etc.) won't affect the build
          # Only build-time variables (VITE_*, REACT_APP_*, etc.) will be used
          export $(echo '${{ toJSON(secrets) }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' | grep -E '^(VITE_|REACT_APP_|NEXT_PUBLIC_|BUILD_)' || true)
          npm run build

      - name: "Install Vercel CLI"
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: "Pull Vercel Environment Information"
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: "Deploy to Vercel"
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployment URL: $DEPLOYMENT_URL"
        id: vercel-deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: "Notify Vercel deployment success"
        if: success() && steps.check-secrets.outputs.configured == 'true'
        run: |
          echo "▲ Deployed to Vercel successfully!"
          echo "• Deployment URL: ${{ steps.vercel-deploy.outputs.deployment-url }}"
          echo "• Project ID: ${{ secrets.VERCEL_PROJECT_ID }}"

      - name: "Notify Vercel deployment failure"
        if: failure() && steps.check-secrets.outputs.configured == 'true'
        run: |
          echo "❌ Vercel deployment FAILED for commit ${{ github.sha }}"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
